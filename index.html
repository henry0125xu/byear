<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ByEar</title>
  </head>
  <body>
    <header class="top">
      <h1>ByEar</h1>
      <label class="file-btn">
        Open audio…
        <input id="file" type="file" accept="audio/*" hidden />
      </label>
      <span id="file-name" class="muted">Drop an audio file anywhere</span>
      <span class="spacer"></span>
      <span id="ws-status" class="muted small"></span>
      <button id="ws-export" class="small" title="Download this song's workspace as JSON">Export</button>
      <button id="ws-import" class="small" title="Load a workspace JSON into the current song">Import</button>
      <input id="ws-import-file" type="file" accept=".json,application/json" hidden />
    </header>

    <section class="panel">
      <canvas id="wave"></canvas>
      <div class="transport">
        <button id="play" title="Play / Pause (Space)">▶</button>
        <button id="stop" title="Stop (Esc)">■</button>
        <span id="time" class="mono">0:00.0 / 0:00.0</span>
        <span class="sep"></span>
        <button id="set-a" title="Set A at playhead ([)">A</button>
        <button id="set-b" title="Set B at playhead (])">B</button>
        <button id="loop" title="Toggle loop (L)">Loop</button>
        <select id="preroll" class="small" title="Start this much before A when jumping to it">
          <option value="0">No pre-roll</option>
          <option value="0.5">Pre-roll 0.5 s</option>
          <option value="1">Pre-roll 1 s</option>
          <option value="2">Pre-roll 2 s</option>
        </select>
        <span id="loop-info" class="mono muted"></span>
      </div>
    </section>

    <section class="panel controls">
      <div class="ctl">
        <label>Speed <span id="speed-val" class="mono">100%</span></label>
        <input id="speed" type="range" min="25" max="125" step="1" value="100" />
        <div class="presets">
          <button data-speed="100">100</button>
          <button data-speed="75">75</button>
          <button data-speed="50">50</button>
        </div>
        <select id="engine" class="small" title="Time-stretch engine">
          <option value="rubberband-hq">Rubber Band HQ</option>
          <option value="rubberband">Rubber Band (lighter)</option>
          <option value="soundtouch">SoundTouch</option>
        </select>
        <span id="engine-status" class="muted small"></span>
      </div>
      <div class="ctl">
        <label>Transpose <span id="semi-val" class="mono">0</span> st</label>
        <input id="semi" type="range" min="-12" max="12" step="1" value="0" />
      </div>
      <div class="ctl">
        <label>Fine-tune <span id="cents-val" class="mono">0</span> ¢</label>
        <input id="cents" type="range" min="-50" max="50" step="1" value="0" />
      </div>
      <div class="ctl">
        <label>Recording vol</label>
        <input id="rec-vol" type="range" min="0" max="100" value="80" />
      </div>
      <div class="ctl">
        <label>Tone vol <span id="tone-vol-val" class="mono">120%</span></label>
        <input id="tone-vol" type="range" min="0" max="200" value="120" />
      </div>
      <div class="ctl">
        <label>Sound</label>
        <select id="instrument"></select>
        <label class="inline"><input id="strum" type="checkbox" /> Strum</label>
        <label class="inline" title="Released notes ring on, like a sustain pedal"><input id="sustain" type="checkbox" /> Sustain</label>
        <span id="sample-status" class="muted small"></span>
      </div>
    </section>

    <section class="panel">
      <form id="chord-form" class="chord-form">
        <input id="chord-input" placeholder="Chord, e.g. Am7, F#maj7, G/B" autocomplete="off" />
        <button type="submit">Add</button>
        <span id="chord-error" class="error small"></span>
      </form>
      <div id="chords" class="chords"></div>
    </section>

    <section class="panel">
      <div class="pad-head">
        <span class="muted small">Notes</span>
        <button id="pad-toggle" class="small" title="Switch note view">Piano view</button>
      </div>
      <div id="note-grid"></div>
      <div id="piano" hidden></div>
    </section>

    <footer class="muted small">
      Space play/pause · Esc stop · [ ] set A/B · L loop · Enter jump to A · ←/→ seek 2s · Shift+←/→ move A · Ctrl+←/→ move B · 1–9 hold chord
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
